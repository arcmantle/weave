<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Orillusion Knight Viewer</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
			background: transparent;
			color: #f4f0e2;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100vh;
			background: transparent;
		}

		body {
			overflow: hidden;
		}

		.app-shell {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			pointer-events: none;
		}

		#app-canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			opacity: 0;
			pointer-events: none;
			transition: opacity 120ms ease-out;
		}

		.app-shell.is-ready #app-canvas {
			opacity: 1;
		}

		.hud-panel {
			position: absolute;
			top: 16px;
			left: 16px;
			z-index: 2;
			width: min(320px, calc(100vw - 32px));
			padding: 14px;
			border: 1px solid rgba(244, 240, 226, 0.14);
			border-radius: 14px;
			backdrop-filter: blur(10px);
			background: rgba(14, 18, 24, 0.78);
			box-shadow: 0 18px 42px rgba(0, 0, 0, 0.35);
			pointer-events: auto;
		}

		.hud-title {
			margin-bottom: 12px;
			font-size: 0.92rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #d6b16b;
		}

		.hud-row {
			display: grid;
			gap: 8px;
			margin-bottom: 12px;
			font-size: 0.92rem;
		}

		.hud-row span {
			color: rgba(244, 240, 226, 0.8);
		}

		select,
		button {
			width: 100%;
			padding: 10px 12px;
			border: 1px solid rgba(244, 240, 226, 0.16);
			border-radius: 10px;
			background: rgba(28, 34, 44, 0.9);
			color: inherit;
			font: inherit;
		}

		button {
			cursor: pointer;
		}

		button:hover,
		select:hover {
			border-color: rgba(214, 177, 107, 0.5);
		}

		.hud-actions {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			margin-bottom: 12px;
		}

		.hud-status {
			font-size: 0.85rem;
			line-height: 1.45;
			color: rgba(244, 240, 226, 0.88);
			white-space: pre-line;
		}

		@media (max-width: 640px) {
			.hud-panel {
				padding: 12px;
				border-radius: 12px;
			}

			.hud-actions {
				grid-template-columns: 1fr;
			}
		}
	</style>
	<script type="module" src="./src/main.ts"></script>
</head>
<body>
	<div class="app-shell">
		<canvas id="app-canvas" aria-label="Orillusion knight viewer canvas"></canvas>
		<div class="hud-panel">
			<div class="hud-title">Colour2 Outline Viewer</div>
			<label class="hud-row">
				<span>Behavior</span>
				<select id="behavior-select"></select>
			</label>
			<label class="hud-row">
				<span>Character</span>
				<select id="character-select"></select>
			</label>
			<label class="hud-row">
				<span>Animation</span>
				<select id="animation-select"></select>
			</label>
			<div class="hud-actions">
				<button id="play-toggle" type="button">Pause</button>
				<button id="restart-animation" type="button">Restart</button>
			</div>
			<div id="animation-status" class="hud-status"></div>
		</div>
	</div>
	<noscript>This prototype requires JavaScript and a WebGPU-capable browser.</noscript>
</body>
</html>
