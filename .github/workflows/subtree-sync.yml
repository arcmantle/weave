name: Sync packages to standalone repos

on:
  push:
    branches: [main]
    paths: ['components/**','packages/**']
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Detect changed packages
        id: set-matrix
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node .github/scripts/detect-package-changes.ts

  sync-subtree:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: arcmantle/github-workflows/.github/workflows/subtree-sync.yml@main
    with:
      package-path: ${{ matrix.packagePath }}
      target-repo: ${{ matrix.targetRepo }}
    secrets:
      sync-token: ${{ secrets.SYNC_SUBTREE }}

  trigger-publish:
    needs: [detect-changes, sync-subtree]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18

      - name: Install dependencies
        run: pnpm install --filter @arcmantle/workspace-scripts --frozen-lockfile=false

      - name: Generate dependency map
        id: deps
        run: |
          DEPS_JSON=$(pnpm workspace pnpm-to-semver)
          echo "deps-map<<EOF" >> $GITHUB_OUTPUT
          echo "$DEPS_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$DEPS_JSON"

      - name: Trigger target repo publish
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_SUBTREE }}
          script: |
            const [owner, repo] = '${{ matrix.targetRepo }}'.split('/');
            const depsMap = JSON.parse(`${{ steps.deps.outputs.deps-map }}`);

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'publish.yml',
              ref: 'main',
              inputs: {
                'dependency-map': JSON.stringify(depsMap),
                'triggered-by': 'subtree-sync'
              }
            });
