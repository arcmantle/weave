<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Docs</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ff6b35'/%3E%3Cstop offset='100%25' stop-color='%23f7931e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%231c1f2e'/%3E%3Cpath d='M20 44 L32 14 L44 44 Z' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linejoin='round'/%3E%3Cline x1='24' y1='36' x2='40' y2='36' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='22' r='3' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
:root {
	color-scheme: dark;
	--bg: #0f1117;
	--bg-panel: #161822;
	--bg-card: #1c1f2e;
	--bg-hover: #252840;
	--bg-active: #2a2d45;
	--bg-badge: #2a2d45;
	--border: #2a2d45;
	--text: #e1e4ed;
	--text-muted: #8b8fa7;
	--text-dim: #5c6078;
	--accent: #58a6ff;
	--accent-dim: #264f78;
	--green: #56d364;
	--orange: #d29922;
	--red: #f85149;
	--purple: #bc8cff;
	--cyan: #39d2c0;
	--radius: 8px;
	--radius-sm: 4px;
	--font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
	--font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
	--shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

html, body {
	height: 100%;
	overflow: hidden;
}

body {
	font-family: var(--font-sans);
	background: var(--bg);
	color: var(--text);
	display: flex;
	flex-direction: column;
}

/* ─── Header ─── */
.header {
	display: flex;
	align-items: center;
	gap: 16px;
	padding: 12px 24px;
	background: var(--bg-panel);
	border-bottom: 1px solid var(--border);
	flex-shrink: 0;
	z-index: 10;
}

.header-logo {
	display: flex;
	align-items: center;
	gap: 10px;
	flex-shrink: 0;
}

.header-logo svg {
	width: 24px;
	height: 24px;
	color: var(--accent);
}

.header-title {
	font-size: 16px;
	font-weight: 600;
	color: var(--text);
	letter-spacing: -0.3px;
}

.header-project {
	font-size: 13px;
	color: var(--text-muted);
	padding: 3px 10px;
	background: var(--bg-badge);
	border-radius: 12px;
}

.header-spacer { flex: 1; }

.header-version {
	font-size: 12px;
	color: var(--text-dim);
	font-family: var(--font-mono);
}

/* ─── Search ─── */
.search-wrapper {
	position: relative;
	width: 280px;
}

.search-wrapper svg {
	position: absolute;
	left: 10px;
	top: 50%;
	transform: translateY(-50%);
	width: 16px;
	height: 16px;
	color: var(--text-dim);
	pointer-events: none;
}

.search-input {
	width: 100%;
	padding: 7px 12px 7px 34px;
	background: var(--bg);
	border: 1px solid var(--border);
	border-radius: var(--radius);
	color: var(--text);
	font-size: 13px;
	font-family: var(--font-sans);
	outline: none;
	transition: border-color 0.15s;
}

.search-input::placeholder {
	color: var(--text-dim);
}

.search-input:focus {
	border-color: var(--accent);
}

/* ─── Layout ─── */
.layout {
	display: flex;
	flex: 1;
	overflow: hidden;
}

/* ─── Sidebar ─── */
.sidebar {
	width: 280px;
	flex-shrink: 0;
	background: var(--bg-panel);
	border-right: 1px solid var(--border);
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

.sidebar-content {
	flex: 1;
	overflow-y: auto;
	padding: 8px;
}

.sidebar-content::-webkit-scrollbar {
	width: 6px;
}

.sidebar-content::-webkit-scrollbar-thumb {
	background: var(--border);
	border-radius: 3px;
}

.sidebar-group {
	margin-bottom: 4px;
}

.sidebar-group-header {
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 6px 10px;
	font-size: 11px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.5px;
	color: var(--text-dim);
	cursor: pointer;
	user-select: none;
	border-radius: var(--radius-sm);
	transition: color 0.15s;
}

.sidebar-group-header:hover {
	color: var(--text-muted);
}

.sidebar-group-header svg {
	width: 12px;
	height: 12px;
	transition: transform 0.15s;
}

.sidebar-group-header.collapsed svg {
	transform: rotate(-90deg);
}

.sidebar-group-items {
	overflow: hidden;
}

.sidebar-group-items.collapsed {
	display: none;
}

.sidebar-item {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 6px 10px 6px 20px;
	font-size: 13px;
	color: var(--text-muted);
	cursor: pointer;
	border-radius: var(--radius-sm);
	transition: background 0.1s, color 0.1s;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

.sidebar-item.top-level {
	padding-left: 10px;
}

.sidebar-item:hover {
	background: var(--bg-hover);
	color: var(--text);
}

.sidebar-item.active {
	background: var(--accent-dim);
	color: var(--accent);
}

.sidebar-item .badge {
	margin-left: auto;
	font-size: 10px;
	padding: 1px 6px;
	border-radius: 8px;
	font-weight: 500;
	flex-shrink: 0;
}

.badge-script {
	background: rgba(86, 211, 100, 0.15);
	color: var(--green);
}

.badge-composite {
	background: rgba(188, 140, 255, 0.15);
	color: var(--purple);
}

.sidebar-stats {
	padding: 12px 16px;
	border-top: 1px solid var(--border);
	font-size: 12px;
	color: var(--text-dim);
	display: flex;
	gap: 16px;
	flex-shrink: 0;
}

.sidebar-stats span {
	color: var(--text-muted);
}

/* ─── Main Content ─── */
.main {
	flex: 1;
	overflow-y: auto;
	padding: 32px 48px;
}

.main::-webkit-scrollbar {
	width: 8px;
}

.main::-webkit-scrollbar-thumb {
	background: var(--border);
	border-radius: 4px;
}

/* ─── Welcome Screen ─── */
.welcome {
	max-width: 640px;
	margin: 0 auto;
	padding-top: 80px;
	text-align: center;
}

.welcome h1 {
	font-size: 28px;
	font-weight: 700;
	margin-bottom: 12px;
	letter-spacing: -0.5px;
}

.welcome p {
	font-size: 15px;
	color: var(--text-muted);
	line-height: 1.6;
	margin-bottom: 32px;
}

.welcome-stats {
	display: flex;
	justify-content: center;
	gap: 32px;
}

.welcome-stat {
	text-align: center;
}

.welcome-stat .number {
	font-size: 32px;
	font-weight: 700;
	color: var(--accent);
}

.welcome-stat .label {
	font-size: 12px;
	color: var(--text-dim);
	text-transform: uppercase;
	letter-spacing: 0.5px;
	margin-top: 4px;
}

.welcome-hint {
	margin-top: 48px;
	font-size: 13px;
	color: var(--text-dim);
}

.welcome-hint kbd {
	font-family: var(--font-mono);
	font-size: 12px;
	padding: 2px 6px;
	background: var(--bg-card);
	border: 1px solid var(--border);
	border-radius: var(--radius-sm);
	color: var(--text-muted);
}

/* ─── Command Detail ─── */
.command-detail {
	padding-bottom: 24px;
	max-width: 720px;
}

.command-header {
	margin-bottom: 24px;
}

.command-name {
	font-size: 24px;
	font-weight: 700;
	font-family: var(--font-mono);
	letter-spacing: -0.5px;
	margin-bottom: 8px;
	display: flex;
	align-items: center;
	gap: 12px;
}

.command-description {
	font-size: 15px;
	color: var(--text-muted);
	line-height: 1.5;
}

.command-meta {
	display: flex;
	gap: 12px;
	margin-top: 12px;
	flex-wrap: wrap;
}

.meta-chip {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	font-size: 12px;
	padding: 4px 10px;
	background: var(--bg-card);
	border: 1px solid var(--border);
	border-radius: 12px;
	color: var(--text-muted);
	font-family: var(--font-mono);
}

.meta-chip svg {
	width: 14px;
	height: 14px;
}

/* ─── Sections ─── */
.section {
	margin-top: 28px;
}

.section-title {
	font-size: 13px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.5px;
	color: var(--text-dim);
	margin-bottom: 12px;
	padding-bottom: 8px;
	border-bottom: 1px solid var(--border);
}

/* ─── Usage Box ─── */
.usage-box {
	background: var(--bg-card);
	border: 1px solid var(--border);
	border-radius: var(--radius);
	padding: 14px 18px;
	font-family: var(--font-mono);
	font-size: 13px;
	color: var(--cyan);
	overflow-x: auto;
}

.usage-prefix {
	color: var(--text-dim);
	margin-right: 4px;
}

.usage-required {
	color: var(--orange);
}

.usage-optional {
	color: var(--text-dim);
}

/* ─── Argument Table ─── */
.arg-table {
	width: 100%;
	border-collapse: collapse;
}

.arg-table th {
	text-align: left;
	font-size: 11px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.5px;
	color: var(--text-dim);
	padding: 8px 12px;
	border-bottom: 1px solid var(--border);
}

.arg-table td {
	padding: 10px 12px;
	font-size: 13px;
	border-bottom: 1px solid var(--border);
	vertical-align: top;
}

.arg-table tr:last-child td {
	border-bottom: none;
}

.arg-table tr:hover td {
	background: var(--bg-hover);
}

.arg-name {
	font-family: var(--font-mono);
	font-weight: 600;
	color: var(--accent);
	white-space: nowrap;
}

.arg-type {
	font-family: var(--font-mono);
	font-size: 12px;
	padding: 1px 6px;
	border-radius: var(--radius-sm);
	white-space: nowrap;
}

.type-string {
	background: rgba(57, 210, 192, 0.12);
	color: var(--cyan);
}

.type-bool {
	background: rgba(210, 153, 34, 0.12);
	color: var(--orange);
}

.arg-required {
	font-size: 11px;
	color: var(--red);
	font-weight: 500;
}

.arg-default {
	font-family: var(--font-mono);
	font-size: 12px;
	color: var(--text-dim);
}

/* ─── Steps (Composite) ─── */
.steps-list {
	display: flex;
	flex-direction: column;
	gap: 2px;
}

.step {
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 10px 14px;
	background: var(--bg-card);
	border: 1px solid var(--border);
	border-radius: var(--radius);
	transition: background 0.1s;
}

.step:hover {
	background: var(--bg-hover);
}

.step-index {
	font-family: var(--font-mono);
	font-size: 11px;
	color: var(--text-dim);
	width: 20px;
	text-align: center;
	flex-shrink: 0;
}

.step-arrow {
	color: var(--text-dim);
	flex-shrink: 0;
}

.step-name {
	font-family: var(--font-mono);
	font-size: 13px;
	color: var(--accent);
	cursor: pointer;
}

.step-name:hover {
	text-decoration: underline;
}

.step-args {
	font-family: var(--font-mono);
	font-size: 12px;
	color: var(--text-dim);
}

.step-parallel-badge {
	font-size: 10px;
	padding: 2px 8px;
	border-radius: 8px;
	background: rgba(188, 140, 255, 0.15);
	color: var(--purple);
	font-weight: 600;
	white-space: nowrap;
}

.parallel-entries {
	display: flex;
	gap: 8px;
	flex-wrap: wrap;
}

.parallel-entry {
	font-family: var(--font-mono);
	font-size: 13px;
	color: var(--accent);
	cursor: pointer;
}

.parallel-entry:hover {
	text-decoration: underline;
}

.parallel-separator {
	color: var(--text-dim);
}

/* ─── No Results ─── */
.no-results {
	text-align: center;
	padding: 48px 24px;
	color: var(--text-dim);
}

.no-results p {
	margin-top: 8px;
	font-size: 14px;
}

/* ─── Keyboard shortcut ─── */
.kbd-hint {
	position: fixed;
	bottom: 16px;
	right: 16px;
	font-size: 11px;
	color: var(--text-dim);
	display: flex;
	align-items: center;
	gap: 6px;
}

.kbd-hint kbd {
	font-family: var(--font-mono);
	font-size: 11px;
	padding: 2px 6px;
	background: var(--bg-card);
	border: 1px solid var(--border);
	border-radius: var(--radius-sm);
}

/* ─── Loading ─── */
.loading {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	height: 100%;
	gap: 16px;
	color: var(--text-muted);
}

.loading-spinner {
	width: 32px;
	height: 32px;
	border: 3px solid var(--border);
	border-top-color: var(--accent);
	border-radius: 50%;
	animation: spin 0.8s linear infinite;
}

@keyframes spin {
	to { transform: rotate(360deg); }
}

.loading-text {
	font-size: 14px;
}

.loading-sub {
	font-size: 12px;
	color: var(--text-dim);
}

.status-icon {
	display: inline-flex;
	align-items: center;
	margin-right: 4px;
	flex-shrink: 0;
}
.status-icon.pending {
	color: var(--text-dim);
	font-size: 16px;
	line-height: 1;
}
.status-icon.compiling svg, .status-icon.ready svg {
	display: block;
}

.status-loading {
	color: var(--accent);
	animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
	0%, 100% { opacity: 1; }
	50% { opacity: 0.5; }
}

.meta-loading {
	display: flex;
	align-items: center;
	gap: 8px;
	color: var(--text-dim);
	font-size: 13px;
	padding: 12px 0;
}

/* ─── Runner ─── */
.runner-section {
	margin-top: 28px;
}
.runner-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 12px;
}
.runner-form {
	display: flex;
	flex-direction: column;
	gap: 10px;
}
.runner-field {
	display: flex;
	align-items: center;
	gap: 10px;
}
.runner-field label {
	font-family: var(--font-mono);
	font-size: 13px;
	color: var(--accent);
	min-width: 120px;
	flex-shrink: 0;
}
.runner-field-meta {
	font-size: 11px;
	color: var(--text-dim);
	margin-left: 4px;
	font-family: var(--font-sans);
	font-weight: 400;
}
.runner-input {
	flex: 1;
	background: var(--bg);
	border: 1px solid var(--border);
	border-radius: var(--radius-sm);
	padding: 7px 12px;
	color: var(--text);
	font-family: var(--font-mono);
	font-size: 13px;
	outline: none;
	transition: border-color 0.15s;
	&:focus {
		border-color: var(--accent);
	}
	&::placeholder {
		color: var(--text-dim);
	}
}
.runner-checkbox-wrap {
	display: flex;
	align-items: center;
	gap: 6px;
	cursor: pointer;
}
.runner-checkbox {
	appearance: none;
	width: 16px;
	height: 16px;
	background: var(--bg);
	border: 1px solid var(--border);
	border-radius: 3px;
	cursor: pointer;
	position: relative;
	&:checked {
		background: var(--accent);
		border-color: var(--accent);
	}
	&:checked::after {
		content: '';
		position: absolute;
		top: 2px;
		left: 5px;
		width: 4px;
		height: 8px;
		border: solid var(--bg);
		border-width: 0 2px 2px 0;
		transform: rotate(45deg);
	}
}
.runner-actions {
	display: flex;
	gap: 8px;
	margin-top: 4px;
}
.runner-btn {
	padding: 8px 20px;
	border-radius: var(--radius-sm);
	border: none;
	font-family: var(--font-sans);
	font-size: 13px;
	font-weight: 600;
	cursor: pointer;
	transition: background 0.15s, opacity 0.15s;
	display: flex;
	align-items: center;
	gap: 6px;
}
.runner-btn:disabled {
	opacity: 0.5;
	cursor: not-allowed;
}
.runner-btn-run {
	background: var(--green);
	color: var(--bg);
	&:hover:not(:disabled) { opacity: 0.85; }
}
.runner-btn-stop {
	background: var(--red);
	color: #fff;
	&:hover:not(:disabled) { opacity: 0.85; }
}
.runner-btn-clear {
	background: var(--bg-badge);
	color: var(--text-muted);
	&:hover:not(:disabled) { background: var(--bg-hover); }
}
.runner-terminal {
	margin-top: 12px;
	background: #0d0d0d;
	border: 1px solid var(--border);
	border-radius: var(--radius);
	overflow: hidden;
}
.runner-terminal-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 8px 14px;
	background: var(--bg-card);
	border-bottom: 1px solid var(--border);
	font-size: 11px;
	color: var(--text-dim);
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.5px;
}
.runner-terminal-status {
	display: flex;
	align-items: center;
	gap: 6px;
}
.runner-terminal-dot {
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: var(--text-dim);
}
.runner-terminal-dot.running {
	background: var(--green);
	animation: pulse 1.5s ease-in-out infinite;
}
.runner-terminal-dot.exited-ok {
	background: var(--green);
}
.runner-terminal-dot.exited-err {
	background: var(--red);
}
.runner-terminal-output {
	padding: 12px 16px;
	font-family: var(--font-mono);
	font-size: 13px;
	line-height: 1.6;
	color: #cccccc;
	height: 400px;
	overflow-y: auto;
	white-space: pre-wrap;
	word-break: break-all;
	tab-size: 4;
}

.example-content {
	font-size: 14px;
	line-height: 1.7;
	color: var(--text);
	h1, h2, h3, h4 {
		margin: 16px 0 8px;
		color: var(--text);
		font-weight: 600;
	}
	h1 { font-size: 18px; }
	h2 { font-size: 16px; }
	h3 { font-size: 14px; }
	p {
		margin: 8px 0;
	}
	ul {
		margin: 8px 0;
		padding-left: 20px;
	}
	li {
		margin: 4px 0;
	}
	pre {
		background: var(--bg-card);
		border: 1px solid var(--border);
		border-radius: var(--radius-sm);
		padding: 12px 16px;
		margin: 8px 0;
		overflow-x: auto;
	}
	code {
		font-family: var(--font-mono);
		font-size: 13px;
	}
	:not(pre) > code {
		background: var(--bg-card);
		padding: 2px 6px;
		border-radius: 3px;
		color: var(--accent);
	}
	strong {
		font-weight: 600;
		color: var(--text);
	}
	em {
		font-style: italic;
		color: var(--text-muted);
	}
	a {
		color: var(--accent);
		text-decoration: none;
		&:hover { text-decoration: underline; }
	}
}
</style>
</head>
<body>
<!-- Header -->
<div class="header">
	<div class="header-logo">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M12 2L2 7l10 5 10-5-10-5z"/>
			<path d="M2 17l10 5 10-5"/>
			<path d="M2 12l10 5 10-5"/>
		</svg>
		<span class="header-title">Forge Docs</span>
	</div>
	<span class="header-project" id="project-name"></span>
	<div class="header-spacer"></div>
	<div class="search-wrapper">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<circle cx="11" cy="11" r="8"/>
			<line x1="21" y1="21" x2="16.65" y2="16.65"/>
		</svg>
		<input type="text" class="search-input" id="search" placeholder="Search commands..." autocomplete="off">
	</div>
	<span class="header-version" id="version"></span>
</div>

<!-- Layout -->
<div class="layout">
	<!-- Sidebar -->
	<div class="sidebar">
		<div class="sidebar-content" id="sidebar-list"></div>
		<div class="sidebar-stats" id="sidebar-stats"></div>
	</div>

	<!-- Main -->
	<div class="main" id="main-content"></div>
</div>

<div class="kbd-hint">
	<kbd>/</kbd> Focus search
</div>

<script>
// ─── Data (loaded from server) ───
let FORGE_DATA = {};

// ─── Meta status tracking ───
// Tracks per-command status: 'pending' | 'compiling' | 'ready'
const metaStatus = {};
let metaDone = false;

// ─── Heartbeat ───
setInterval(() => {
	fetch('/api/ping', { method: 'POST' }).catch(() => {});
}, 2000);

// Signal server shutdown when the tab/window is closed.
document.addEventListener('visibilitychange', () => {
	if (document.visibilityState === 'hidden') {
		navigator.sendBeacon('/api/shutdown');
	}
});
window.addEventListener('pagehide', () => {
	navigator.sendBeacon('/api/shutdown');
});

// ─── State ───
let activeCommand = null;
let searchQuery = '';

// ─── Initialization ───
async function init() {
	setupSearch();
	setupKeyboard();

	// Fetch basic manifest data (instant — no compilation).
	try {
		const res = await fetch('/api/data');
		FORGE_DATA = await res.json();
	} catch {
		document.getElementById('main-content').innerHTML =
			'<div class="no-results"><p>Failed to load command data.</p></div>';
		return;
	}

	document.getElementById('project-name').textContent = FORGE_DATA.projectName || 'forge';
	document.getElementById('version').textContent = FORGE_DATA.version ? 'v' + FORGE_DATA.version : '';

	// Mark all script commands as pending.
	(FORGE_DATA.commands || []).forEach(cmd => {
		if (cmd.commandType === 'script') metaStatus[cmd.name] = 'pending';
	});

	renderSidebar();
	renderWelcome();

	// Connect to SSE for streaming metadata updates.
	connectSSE();
}

// ─── SSE Connection ───
function connectSSE() {
	const source = new EventSource('/api/events');

	source.addEventListener('meta', (e) => {
		const update = JSON.parse(e.data);
		metaStatus[update.name] = update.status;

		if (update.status === 'ready') {
			// Merge metadata into the command.
			const cmd = (FORGE_DATA.commands || []).find(c => c.name === update.name);
			if (cmd) {
				if (update.positionals) cmd.positionals = update.positionals;
				if (update.flags) cmd.flags = update.flags;
				if (update.description && !cmd.description) cmd.description = update.description;
			}

			// Re-render if this command is currently displayed.
			if (activeCommand === update.name) {
				renderCommandDetail(update.name);
			}
		}

		renderSidebar();
	});

	source.addEventListener('done', () => {
		metaDone = true;
		renderSidebar();
		source.close();
	});

	source.onerror = () => {
		metaDone = true;
		renderSidebar();
		source.close();
	};
}

// ─── Sidebar ───
function renderSidebar() {
	const container = document.getElementById('sidebar-list');
	const stats = document.getElementById('sidebar-stats');
	const commands = FORGE_DATA.commands || [];

	// Group commands
	const groups = {};
	const topLevel = [];

	const filtered = commands.filter(cmd => {
		if (!searchQuery) return true;
		const q = searchQuery.toLowerCase();
		return cmd.name.toLowerCase().includes(q) ||
			(cmd.description || '').toLowerCase().includes(q);
	});

	filtered.forEach(cmd => {
		const colonIdx = cmd.name.indexOf(':');
		if (colonIdx !== -1) {
			const prefix = cmd.name.substring(0, colonIdx);
			if (!groups[prefix]) groups[prefix] = [];
			groups[prefix].push(cmd);
		} else {
			topLevel.push(cmd);
		}
	});

	// Build display order
	const displayOrder = [];
	const seenGroups = new Set();

	topLevel.forEach(cmd => {
		displayOrder.push({ type: 'command', cmd });
		if (groups[cmd.name]) {
			displayOrder.push({ type: 'group', name: cmd.name, children: groups[cmd.name] });
			seenGroups.add(cmd.name);
		}
	});

	Object.keys(groups).sort().forEach(prefix => {
		if (!seenGroups.has(prefix)) {
			displayOrder.push({ type: 'group-only', name: prefix, children: groups[prefix] });
		}
	});

	let html = '';

	displayOrder.forEach(entry => {
		if (entry.type === 'command') {
			const cmd = entry.cmd;
			html += renderSidebarItem(cmd, true);
		} else if (entry.type === 'group' || entry.type === 'group-only') {
			if (entry.type === 'group-only') {
				html += '<div class="sidebar-group"><div class="sidebar-group-header" data-group="' + esc(entry.name) + '">'
					+ chevronSvg() + esc(entry.name) + '</div>';
			} else {
				html += '<div class="sidebar-group"><div class="sidebar-group-header" data-group="' + esc(entry.name) + '">'
					+ chevronSvg() + esc(entry.name) + ' subcommands</div>';
			}
			html += '<div class="sidebar-group-items">';
			entry.children.forEach(cmd => {
				html += renderSidebarItem(cmd, false);
			});
			html += '</div></div>';
		}
	});

	if (filtered.length === 0 && searchQuery) {
		html = '<div class="no-results"><p>No commands match "' + esc(searchQuery) + '"</p></div>';
	}

	container.innerHTML = html;

	// Bind click handlers
	container.querySelectorAll('.sidebar-item').forEach(el => {
		el.addEventListener('click', () => selectCommand(el.dataset.cmd));
	});

	container.querySelectorAll('.sidebar-group-header').forEach(el => {
		el.addEventListener('click', () => {
			el.classList.toggle('collapsed');
			const items = el.nextElementSibling;
			if (items) items.classList.toggle('collapsed');
		});
	});

	// Stats
	const scriptCount = commands.filter(c => c.commandType === 'script').length;
	const compositeCount = commands.filter(c => c.commandType === 'composite').length;
	const readyCount = Object.values(metaStatus).filter(s => s === 'ready').length;
	const totalScripts = Object.keys(metaStatus).length;

	let statsHtml = '<span>' + scriptCount + '</span> scripts · <span>' + compositeCount + '</span> composites';
	if (!metaDone && totalScripts > 0) {
		statsHtml += ' · <span class="status-loading">' + readyCount + '/' + totalScripts + ' loaded</span>';
	}
	stats.innerHTML = statsHtml;
}

// ─── Sidebar Item ───
function renderSidebarItem(cmd, isTopLevel) {
	const isActive = activeCommand === cmd.name;
	const displayName = isTopLevel ? cmd.name : cmd.name.substring(cmd.name.lastIndexOf(':') + 1);
	const status = metaStatus[cmd.name];

	let statusIcon = '';
	if (cmd.commandType === 'script') {
		if (status === 'compiling' || status === 'pending') {
			statusIcon = '<span class="status-icon compiling" title="Loading...">' + spinnerSvg() + '</span>';
		}
	}

	const badge = cmd.commandType === 'composite'
		? '<span class="badge badge-composite">composite</span>'
		: '<span class="badge badge-script">script</span>';

	return '<div class="sidebar-item' + (isTopLevel ? ' top-level' : '') + (isActive ? ' active' : '') + '" data-cmd="' + esc(cmd.name) + '">'
		+ statusIcon + esc(displayName) + badge + '</div>';
}

// ─── Select Command ───
function selectCommand(name) {
	activeCommand = name;
	renderSidebar();
	renderCommandDetail(name);
}

// ─── Welcome Screen ───
function renderWelcome() {
	const main = document.getElementById('main-content');
	const commands = FORGE_DATA.commands || [];
	const scriptCount = commands.filter(c => c.commandType === 'script').length;
	const compositeCount = commands.filter(c => c.commandType === 'composite').length;

	main.innerHTML = '<div class="welcome">'
		+ '<h1>Forge Documentation</h1>'
		+ '<p>Select a command from the sidebar to view its documentation, arguments, and usage.</p>'
		+ '<div class="welcome-stats">'
		+ '<div class="welcome-stat"><div class="number">' + commands.length + '</div><div class="label">Commands</div></div>'
		+ '<div class="welcome-stat"><div class="number">' + scriptCount + '</div><div class="label">Scripts</div></div>'
		+ '<div class="welcome-stat"><div class="number">' + compositeCount + '</div><div class="label">Composites</div></div>'
		+ '</div>'
		+ '<div class="welcome-hint">Press <kbd>/</kbd> to search · Click a command to view details</div>'
		+ '</div>';
}

// ─── Command Detail ───
function renderCommandDetail(name) {
	const main = document.getElementById('main-content');
	const cmd = (FORGE_DATA.commands || []).find(c => c.name === name);
	if (!cmd) return;

	let html = '<div class="command-detail"><div class="command-header">';
	html += '<div class="command-name">' + esc(cmd.name);
	if (cmd.commandType === 'composite') {
		html += ' <span class="badge badge-composite">composite</span>';
	} else {
		html += ' <span class="badge badge-script">script</span>';
	}
	html += '</div>';

	if (cmd.description) {
		html += '<div class="command-description">' + esc(cmd.description) + '</div>';
	}

	// Meta chips
	html += '<div class="command-meta">';
	if (cmd.script) {
		html += '<div class="meta-chip">' + fileSvg() + esc(cmd.script) + '</div>';
	}
	if (cmd.language) {
		html += '<div class="meta-chip">' + esc(cmd.language) + '</div>';
	}
	html += '</div></div>';

	// Loading indicator for scripts still compiling
	const status = metaStatus[cmd.name];
	if (cmd.commandType === 'script' && status && status !== 'ready') {
		html += '<div class="section"><div class="meta-loading">'
			+ '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px"></div>'
			+ '<span>Loading argument metadata...</span></div></div>';
	}

	// Usage
	if (cmd.commandType === 'script') {
		html += renderUsage(cmd);
	}

	// Arguments
	if (cmd.positionals && cmd.positionals.length > 0) {
		html += '<div class="section"><div class="section-title">Arguments</div>';
		html += renderArgTable(cmd.positionals, true);
		html += '</div>';
	}

	// Flags & Options
	if (cmd.flags && cmd.flags.length > 0) {
		html += '<div class="section"><div class="section-title">Flags &amp; Options</div>';
		html += renderArgTable(cmd.flags, false);
		html += '</div>';
	}

	// Steps (composite)
	if (cmd.steps && cmd.steps.length > 0) {
		html += '<div class="section"><div class="section-title">Run Steps</div>';
		html += renderSteps(cmd.steps);
		html += '</div>';
	}

	// Example
	if (cmd.example) {
		html += '<div class="section"><div class="section-title">Example</div>';
		html += '<div class="example-content">' + renderMarkdown(cmd.example) + '</div>';
		html += '</div>';
	}

	// Runner
	if (cmd.commandType === 'script' || cmd.commandType === 'composite') {
		html += renderRunner(cmd);
	}

	html += '</div>';
	main.innerHTML = html;

	// Bind step command clicks
	main.querySelectorAll('.step-name, .parallel-entry').forEach(el => {
		el.addEventListener('click', () => {
			const target = el.dataset.cmd;
			if ((FORGE_DATA.commands || []).find(c => c.name === target)) {
				selectCommand(target);
			}
		});
	});

	// Bind runner
	bindRunner(cmd);
}

// ─── Usage Line ───
function renderUsage(cmd) {
	let usage = '<span class="usage-prefix">$</span> forge ' + esc(cmd.name);

	if (cmd.positionals) {
		cmd.positionals.forEach(p => {
			if (p.required) {
				usage += ' <span class="usage-required">&lt;' + esc(p.name) + '&gt;</span>';
			} else {
				usage += ' <span class="usage-optional">[' + esc(p.name) + ']</span>';
			}
		});
	}

	if (cmd.flags && cmd.flags.length > 0) {
		usage += ' <span class="usage-optional">[flags]</span>';
	}

	return '<div class="section"><div class="section-title">Usage</div>'
		+ '<div class="usage-box">' + usage + '</div></div>';
}

// ─── Argument Table ───
function renderArgTable(args, isPositional) {
	let html = '<table class="arg-table"><thead><tr>'
		+ '<th>Name</th><th>Type</th><th>Description</th>'
		+ (isPositional ? '<th>Required</th>' : '<th>Default</th>')
		+ '</tr></thead><tbody>';

	args.forEach(a => {
		const typeClass = a.type === 'bool' ? 'type-bool' : 'type-string';
		html += '<tr>';
		html += '<td><span class="arg-name">' + (isPositional ? '' : '--') + esc(a.name) + '</span></td>';
		html += '<td><span class="arg-type ' + typeClass + '">' + esc(a.type || 'string') + '</span></td>';
		html += '<td>' + esc(a.description || '') + '</td>';
		if (isPositional) {
			html += '<td>' + (a.required ? '<span class="arg-required">required</span>' : '') + '</td>';
		} else {
			html += '<td><span class="arg-default">' + esc(a.defaultValue || '') + '</span></td>';
		}
		html += '</tr>';
	});

	html += '</tbody></table>';
	return html;
}

// ─── Steps ───
function renderSteps(steps) {
	let html = '<div class="steps-list">';

	steps.forEach((step, i) => {
		html += '<div class="step">';
		html += '<span class="step-index">' + (i + 1) + '</span>';
		html += '<span class="step-arrow">→</span>';

		if (step.parallel && step.parallel.length > 0) {
			html += '<span class="step-parallel-badge">parallel</span>';
			html += '<div class="parallel-entries">';
			step.parallel.forEach((entry, j) => {
				if (j > 0) html += '<span class="parallel-separator">·</span>';
				const parts = entry.split(' ');
				html += '<span class="parallel-entry" data-cmd="' + esc(parts[0]) + '">' + esc(parts[0]) + '</span>';
				if (parts.length > 1) {
					html += '<span class="step-args">' + esc(parts.slice(1).join(' ')) + '</span>';
				}
			});
			html += '</div>';
		} else {
			html += '<span class="step-name" data-cmd="' + esc(step.command) + '">' + esc(step.command) + '</span>';
			if (step.args && step.args.length > 0) {
				html += '<span class="step-args">' + esc(step.args.join(' ')) + '</span>';
			}
		}

		html += '</div>';
	});

	html += '</div>';
	return html;
}

// ─── Runner ───
let runnerAbort = null;
let runnerRunning = false;
let runnerRawBuffer = '';

function renderRunner(cmd) {
	let html = '<div class="section runner-section"><div class="section-title">Run</div>';
	html += '<div class="runner-form" id="runner-form">';

	// Positional inputs
	if (cmd.positionals && cmd.positionals.length > 0) {
		cmd.positionals.forEach(p => {
			html += '<div class="runner-field">';
			html += '<label>' + esc(p.name);
			if (p.required) html += '<span class="runner-field-meta" style="color:var(--red)"> required</span>';
			html += '</label>';
			html += '<input type="text" class="runner-input" data-arg-name="' + esc(p.name) + '" data-arg-positional="true"'
				+ ' placeholder="' + esc(p.description || p.name) + '"'
				+ (p.defaultValue ? ' value="' + esc(p.defaultValue) + '"' : '')
				+ '>';
			html += '</div>';
		});
	}

	// Flag inputs
	if (cmd.flags && cmd.flags.length > 0) {
		cmd.flags.forEach(f => {
			html += '<div class="runner-field">';
			html += '<label>--' + esc(f.name) + '</label>';
			if (f.type === 'bool') {
				html += '<label class="runner-checkbox-wrap">'
					+ '<input type="checkbox" class="runner-checkbox" data-arg-name="' + esc(f.name) + '" data-arg-flag="true" data-arg-type="bool"'
					+ (f.defaultValue === 'true' ? ' checked' : '')
					+ '>'
					+ '<span style="font-family:var(--font-sans);font-size:13px;color:var(--text-muted)">' + esc(f.description || '') + '</span>'
					+ '</label>';
			} else {
				html += '<input type="text" class="runner-input" data-arg-name="' + esc(f.name) + '" data-arg-flag="true" data-arg-type="string"'
					+ ' placeholder="' + esc(f.description || f.name) + '"'
					+ (f.defaultValue ? ' value="' + esc(f.defaultValue) + '"' : '')
					+ '>';
			}
			html += '</div>';
		});
	}

	// If no args at all, show a freeform input
	if ((!cmd.positionals || cmd.positionals.length === 0) && (!cmd.flags || cmd.flags.length === 0)) {
		html += '<div class="runner-field">';
		html += '<label>args</label>';
		html += '<input type="text" class="runner-input" id="runner-freeform" placeholder="Optional arguments...">';
		html += '</div>';
	}

	html += '<div class="runner-actions">';
	html += '<button class="runner-btn runner-btn-run" id="runner-run">' + playSvg() + 'Run</button>';
	html += '<button class="runner-btn runner-btn-stop" id="runner-stop" disabled>' + stopSvg() + 'Stop</button>';
	html += '<button class="runner-btn runner-btn-clear" id="runner-clear">Clear</button>';
	html += '</div>';
	html += '</div>';

	// Terminal output
	html += '<div class="runner-terminal" id="runner-terminal" style="display:none">';
	html += '<div class="runner-terminal-header"><span>Output</span>'
		+ '<div class="runner-terminal-status"><span class="runner-terminal-dot" id="runner-dot"></span>'
		+ '<span id="runner-status-text"></span></div></div>';
	html += '<div class="runner-terminal-output" id="runner-output"></div>';
	html += '</div>';

	html += '</div>';
	return html;
}

function bindRunner(cmd) {
	const runBtn = document.getElementById('runner-run');
	const stopBtn = document.getElementById('runner-stop');
	const clearBtn = document.getElementById('runner-clear');
	if (!runBtn) return;

	runBtn.addEventListener('click', () => startRun(cmd));
	stopBtn.addEventListener('click', () => stopRun());
	clearBtn.addEventListener('click', () => {
		const output = document.getElementById('runner-output');
		const terminal = document.getElementById('runner-terminal');
		if (output) { output.innerHTML = ''; runnerRawBuffer = ''; }
		if (terminal) terminal.style.display = 'none';
	});

	// Allow Enter in form fields to trigger run
	const form = document.getElementById('runner-form');
	if (form) {
		form.querySelectorAll('input.runner-input').forEach(el => {
			el.addEventListener('keydown', (e) => {
				if (e.key === 'Enter') startRun(cmd);
			});
		});
	}
}

function collectRunArgs() {
	const args = [];
	const form = document.getElementById('runner-form');
	if (!form) return args;

	// Freeform input (when no structured args)
	const freeform = document.getElementById('runner-freeform');
	if (freeform && freeform.value.trim()) {
		return freeform.value.trim().split(/\s+/);
	}

	// Positional args (in order)
	form.querySelectorAll('[data-arg-positional]').forEach(el => {
		if (el.value.trim()) args.push(el.value.trim());
	});

	// Flags
	form.querySelectorAll('[data-arg-flag]').forEach(el => {
		const name = el.dataset.argName;
		if (el.dataset.argType === 'bool') {
			if (el.checked) args.push('--' + name);
		} else {
			if (el.value.trim()) {
				args.push('--' + name, el.value.trim());
			}
		}
	});

	return args;
}

async function startRun(cmd) {
	if (runnerRunning) return;

	const args = collectRunArgs();
	const terminal = document.getElementById('runner-terminal');
	const output = document.getElementById('runner-output');
	const dot = document.getElementById('runner-dot');
	const statusText = document.getElementById('runner-status-text');
	const runBtn = document.getElementById('runner-run');
	const stopBtn = document.getElementById('runner-stop');

	terminal.style.display = 'block';
	output.innerHTML = '';
	runnerRawBuffer = '';
	dot.className = 'runner-terminal-dot running';
	statusText.textContent = 'Running...';
	runBtn.disabled = true;
	stopBtn.disabled = false;
	runnerRunning = true;

	// Scroll after the terminal has rendered so its full height is known.
	requestAnimationFrame(() => {
		const main = document.getElementById('main-content');
		main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' });
	});

	try {
		const controller = new AbortController();
		runnerAbort = controller;

		const res = await fetch('/api/run', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ command: cmd.name, args }),
			signal: controller.signal
		});

		if (!res.ok) {
			const errText = await res.text();
			runnerRawBuffer = errText;
			output.innerHTML = ansiToHtml(errText);
			dot.className = 'runner-terminal-dot exited-err';
			statusText.textContent = 'Error';
			return;
		}

		const reader = res.body.getReader();
		const decoder = new TextDecoder();

		while (true) {
			const { done, value } = await reader.read();
			if (done) break;
			const text = decoder.decode(value, { stream: true });
			runnerRawBuffer += text;
			output.innerHTML = ansiToHtml(runnerRawBuffer);
			output.scrollTop = output.scrollHeight;
		}

		// Check exit code from the last line
		const lines = runnerRawBuffer.trimEnd().split('\n');
		const lastLine = lines[lines.length - 1] || '';
		const exitMatch = lastLine.match(/\x1b\[exit:(\d+)\]/);

		if (exitMatch) {
			// Remove the exit marker from visible output
			let cleaned = lines.slice(0, -1);
			if (cleaned.length > 0 && cleaned[cleaned.length - 1] === '') {
				cleaned = cleaned.slice(0, -1);
			}
			runnerRawBuffer = cleaned.join('\n');
			output.innerHTML = ansiToHtml(runnerRawBuffer);
			const code = parseInt(exitMatch[1], 10);
			dot.className = code === 0 ? 'runner-terminal-dot exited-ok' : 'runner-terminal-dot exited-err';
			statusText.textContent = code === 0 ? 'Completed' : 'Exit code ' + code;
		} else {
			dot.className = 'runner-terminal-dot exited-ok';
			statusText.textContent = 'Completed';
		}

	} catch (e) {
		if (e.name === 'AbortError') {
			dot.className = 'runner-terminal-dot exited-err';
			statusText.textContent = 'Stopped';
		} else {
			runnerRawBuffer += '\nError: ' + e.message;
			output.innerHTML = ansiToHtml(runnerRawBuffer);
			dot.className = 'runner-terminal-dot exited-err';
			statusText.textContent = 'Error';
		}
	} finally {
		runnerRunning = false;
		runnerAbort = null;
		runBtn.disabled = false;
		stopBtn.disabled = true;
	}
}

function stopRun() {
	if (runnerAbort) runnerAbort.abort();
	fetch('/api/run/kill', { method: 'POST' }).catch(() => {});
}

function playSvg() {
	return '<svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px"><polygon points="3,1 13,8 3,15"/></svg>';
}

function stopSvg() {
	return '<svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px"><rect x="2" y="2" width="12" height="12" rx="2"/></svg>';
}

// ─── ANSI Color Parser ───
function ansiToHtml(text) {
	const COLORS = {
		'30': '#555', '31': '#f85149', '32': '#56d364', '33': '#d29922',
		'34': '#58a6ff', '35': '#bc8cff', '36': '#39d2c0', '37': '#cccccc',
		'90': '#6e7681', '91': '#ff7b72', '92': '#7ee787', '93': '#e3b341',
		'94': '#79c0ff', '95': '#d2a8ff', '96': '#56d4dd', '97': '#ffffff'
	};
	const BG_COLORS = {
		'40': '#555', '41': '#f85149', '42': '#56d364', '43': '#d29922',
		'44': '#58a6ff', '45': '#bc8cff', '46': '#39d2c0', '47': '#cccccc',
		'100': '#6e7681', '101': '#ff7b72', '102': '#7ee787', '103': '#e3b341',
		'104': '#79c0ff', '105': '#d2a8ff', '106': '#56d4dd', '107': '#ffffff'
	};

	let result = '';
	let i = 0;
	let bold = false, dim = false, italic = false, underline = false;
	let fg = null, bg = null;
	let spanOpen = false;

	function openSpan() {
		if (spanOpen) result += '</span>';
		const styles = [];
		if (fg) styles.push('color:' + fg);
		if (bg) styles.push('background:' + bg);
		if (bold) styles.push('font-weight:bold');
		if (dim) styles.push('opacity:0.6');
		if (italic) styles.push('font-style:italic');
		if (underline) styles.push('text-decoration:underline');
		if (styles.length > 0) {
			result += '<span style="' + styles.join(';') + '">';
			spanOpen = true;
		} else {
			spanOpen = false;
		}
	}

	while (i < text.length) {
		// Match ESC[ ... m
		if (text[i] === '\x1b' && text[i + 1] === '[') {
			const end = text.indexOf('m', i + 2);
			if (end === -1) { i++; continue; }
			const seq = text.substring(i + 2, end);
			const codes = seq.split(';');

			for (const c of codes) {
				const n = c.trim();
				if (n === '0' || n === '') {
					bold = false; dim = false; italic = false; underline = false;
					fg = null; bg = null;
				} else if (n === '1') { bold = true; }
				else if (n === '2') { dim = true; }
				else if (n === '3') { italic = true; }
				else if (n === '4') { underline = true; }
				else if (n === '22') { bold = false; dim = false; }
				else if (n === '23') { italic = false; }
				else if (n === '24') { underline = false; }
				else if (n === '39') { fg = null; }
				else if (n === '49') { bg = null; }
				else if (COLORS[n]) { fg = COLORS[n]; }
				else if (BG_COLORS[n]) { bg = BG_COLORS[n]; }
			}

			openSpan();
			i = end + 1;
			continue;
		}

		// Escape HTML chars
		if (text[i] === '<') result += '&lt;';
		else if (text[i] === '>') result += '&gt;';
		else if (text[i] === '&') result += '&amp;';
		else result += text[i];
		i++;
	}

	if (spanOpen) result += '</span>';
	return result;
}

// ─── Search ───
function setupSearch() {
	const input = document.getElementById('search');
	input.addEventListener('input', () => {
		searchQuery = input.value;
		renderSidebar();
	});
}

// ─── Keyboard ───
function setupKeyboard() {
	document.addEventListener('keydown', (e) => {
		if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
			e.preventDefault();
			document.getElementById('search').focus();
		}
		if (e.key === 'Escape') {
			document.getElementById('search').blur();
			document.getElementById('search').value = '';
			searchQuery = '';
			renderSidebar();
		}
	});
}

// ─── Helpers ───
function esc(s) {
	if (!s) return '';
	const div = document.createElement('div');
	div.textContent = s;
	return div.innerHTML;
}

function chevronSvg() {
	return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
}

function fileSvg() {
	return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">'
		+ '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>'
		+ '<polyline points="14 2 14 8 20 8"/></svg>';
}

function spinnerSvg() {
	return '<svg viewBox="0 0 16 16" style="width:12px;height:12px;animation:spin 0.8s linear infinite">'
		+ '<circle cx="8" cy="8" r="6" fill="none" stroke="var(--border)" stroke-width="2"/>'
		+ '<path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg>';
}

function checkSvg() {

		+ '<polyline points="3 8 7 12 13 4"/></svg>';
}

// ─── Markdown Renderer ───
function renderMarkdown(src) {
	const lines = src.split('\n');
	let html = '';
	let inCode = false;
	let codeLang = '';
	let codeLines = [];
	let inList = false;

	for (let i = 0; i < lines.length; i++) {
		const line = lines[i];

		// Fenced code blocks
		if (line.trimStart().startsWith('```')) {
			if (inCode) {
				html += '<pre><code' + (codeLang ? ' class="lang-' + esc(codeLang) + '"' : '') + '>'
					+ esc(codeLines.join('\n')) + '</code></pre>';
				codeLines = [];
				codeLang = '';
				inCode = false;
			} else {
				if (inList) { html += '</ul>'; inList = false; }
				codeLang = line.trim().slice(3).trim();
				inCode = true;
			}
			continue;
		}

		if (inCode) {
			codeLines.push(line);
			continue;
		}

		// Blank line — close list
		if (line.trim() === '') {
			if (inList) { html += '</ul>'; inList = false; }
			continue;
		}

		// Headers
		const hMatch = line.match(/^(#{1,4})\s+(.*)/);
		if (hMatch) {
			if (inList) { html += '</ul>'; inList = false; }
			const level = hMatch[1].length;
			html += '<h' + level + '>' + inlineMd(hMatch[2]) + '</h' + level + '>';
			continue;
		}

		// Unordered list
		if (line.match(/^\s*[-*]\s/)) {
			if (!inList) { html += '<ul>'; inList = true; }
			html += '<li>' + inlineMd(line.replace(/^\s*[-*]\s/, '')) + '</li>';
			continue;
		}

		// Ordered list
		if (line.match(/^\s*\d+\.\s/)) {
			if (!inList) { html += '<ul>'; inList = true; }
			html += '<li>' + inlineMd(line.replace(/^\s*\d+\.\s/, '')) + '</li>';
			continue;
		}

		// Paragraph
		if (inList) { html += '</ul>'; inList = false; }
		html += '<p>' + inlineMd(line) + '</p>';
	}

	if (inCode) {
		html += '<pre><code>' + esc(codeLines.join('\n')) + '</code></pre>';
	}
	if (inList) { html += '</ul>'; }

	return html;
}

function inlineMd(text) {
	// Inline code
	text = text.replace(/`([^`]+)`/g, (_, c) => '<code>' + esc(c) + '</code>');
	// Bold
	text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
	// Italic
	text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
	// Links
	text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

	return text;
}
