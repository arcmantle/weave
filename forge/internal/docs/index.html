<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Tasks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ff6b35'/%3E%3Cstop offset='100%25' stop-color='%23f7931e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%231c1f2e'/%3E%3Cpath d='M20 44 L32 14 L44 44 Z' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linejoin='round'/%3E%3Cline x1='24' y1='36' x2='40' y2='36' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='22' r='3' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- Header -->
<div class="header">
	<div class="header-logo">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M12 2L2 7l10 5 10-5-10-5z"/>
			<path d="M2 17l10 5 10-5"/>
			<path d="M2 12l10 5 10-5"/>
		</svg>
		<span class="header-title">Forge Tasks</span>
	</div>
	<span class="header-project" id="project-name"></span>
	<div class="header-nav" id="header-nav">
		<button class="header-nav-btn active" id="nav-tasks" type="button">Tasks</button>
		<button class="header-nav-btn" id="nav-registry" type="button">Registry</button>
	</div>
	<button class="header-refresh-btn" id="refresh-commands" type="button" title="Rediscover commands">Refresh</button>
	<div class="header-spacer"></div>
	<div class="search-wrapper">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<circle cx="11" cy="11" r="8"/>
			<line x1="21" y1="21" x2="16.65" y2="16.65"/>
		</svg>
		<input type="text" class="search-input" id="search" placeholder="Search tasks..." autocomplete="off">
	</div>
	<span class="header-version" id="version"></span>
</div>

<!-- Layout -->
<div class="layout">
	<!-- Sidebar -->
	<forge-sidebar class="sidebar">
		<div class="sidebar-content" id="sidebar-list"></div>
		<div class="sidebar-stats" id="sidebar-stats"></div>
	</forge-sidebar>

	<!-- Main -->
	<forge-command class="main" id="main-content"></forge-command>
	<forge-templates class="main" id="template-content" style="display:none"></forge-templates>
	<forge-registry class="main registry-main" id="registry-content" style="display:none"></forge-registry>
</div>

<script src="/utils.js"></script>
<script src="/markdown.js"></script>
<script src="/runner.js"></script>
<script src="/forge-sidebar.js"></script>
<script src="/forge-command.js"></script>
<script src="/forge-templates.js"></script>
<script src="/forge-registry.js"></script>
<script src="/app.js"></script>
</body>
</html>
