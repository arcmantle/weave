pnpmfile: ../.pnpmfile.cjs

packages:
  - "*"
  - "**"

catalogs:
  pivot:
    '@stylistic/eslint-plugin': ^4.2.0
    '@eslint/js': ^9.30.1
    '@lit/context': ^1.1.6
    '@types/node': ^25.0.3
    '@types/semver': ^7.7.0
    '@types/fs-extra': ^11.0.4
    '@types/yargs': ^17.0.33
    deepmerge-ts: ^7.1.5
    esbuild: ^0.25.2
    eslint: ^9.30.1
    eslint-plugin-lit: ^2.0.0
    eslint-plugin-simple-import-sort: ^12.0.0
    fs-extra: ^11.3.0
    globby: ^14.1.0
    happy-dom: ^17.4.4
    lit: ^3.3.0
    marked: ^16.0.0
    marked-shiki: ^1.2.1
    rimraf: ^6.0.1
    shiki: ^3.22.0
    semver: ^7.7.2
    tslib: ^2.8.1
    tsdown: ^0.13.2
    typedoc: ^0.28.15
    typedoc-github-theme: ^0.3.0
    typescript: ^5.9.2
    typescript-eslint: ^8.35.1
    urlpattern-polyfill: ^10.0.0
    vite: ^7.3.0
    vitest: ^4.0.16
    yargs: ^18.0.0

onlyBuiltDependencies:
  - esbuild

overrides:
  "@arcmantle/pivot-client-router": "workspace:^"
  "@arcmantle/pivot-client-auth": "workspace:^"
  "@arcmantle/pivot-coordinator-client": "workspace:^"

publicHoistPattern:
  - '*eslint*'
